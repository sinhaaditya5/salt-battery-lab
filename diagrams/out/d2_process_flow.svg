    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="21.708" y="47.060681" transform="rotate(-0 21.708 47.060681)">Steps 1–3: cathode (R0 route per Shan et al. 2019); NTP anode made separately (solid-state, carbon-coated). Equipment row = typical, not specified.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="21.708" y="263.831081" transform="rotate(-0 21.708 263.831081)">No NMP solvent, no dry room: aqueous processing at ambient humidity. All laboratory work under a qualified partner's EHS approval.</text>
   </g>
   <g id="text_19">
