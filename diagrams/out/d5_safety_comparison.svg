   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="18.918" y="44.621321" transform="rotate(-0 18.918 44.621321)">Li-ion step</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="241.56" y="44.621321" transform="rotate(-0 241.56 44.621321)">R1 aqueous cell</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="44.621321" transform="rotate(-0 511.074 44.621321)">Status</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="124.38" y="62.38113" transform="rotate(-0 124.38 62.38113)">SEI decomposition (~80-120 C)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="370.458" y="62.38113" transform="rotate(-0 370.458 62.38113)">No SEI in an aqueous Na2SO4 cell</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="62.269814" transform="rotate(-0 511.074 62.269814)">✓ removed</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="124.38" y="86.020746" transform="rotate(-0 124.38 86.020746)">Anode-electrolyte reaction, exothermic</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="370.458" y="86.020746" transform="rotate(-0 370.458 86.020746)">NTP is an oxide; no lithiated graphite + organic solvent</text>
   </g>
   <g id="text_9">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="85.90943" transform="rotate(-0 511.074 85.90943)">✓ removed</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="124.38" y="109.660362" transform="rotate(-0 124.38 109.660362)">Separator melt -&gt; internal short (~130-165 C)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="370.458" y="109.660362" transform="rotate(-0 370.458 109.660362)">Water boils at ~101 C first and clamps temperature while liquid remains</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="109.549046" transform="rotate(-0 511.074 109.549046)">✓ mitigated</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="124.38" y="133.299978" transform="rotate(-0 124.38 133.299978)">Cathode O2 release (NMC ~200 C; LFP much higher)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="370.458" y="133.299978" transform="rotate(-0 370.458 133.299978)">MnO2-type oxides lose O2 only at ~500 C+, endothermically</text>
   </g>
   <g id="text_15">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="133.188662" transform="rotate(-0 511.074 133.188662)">✓ removed in the credible range</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="124.38" y="156.939594" transform="rotate(-0 124.38 156.939594)">Electrolyte combustion (flammable carbonates)</text>
   </g>
   <g id="text_17">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="370.458" y="156.939594" transform="rotate(-0 370.458 156.939594)">Electrolyte is water + Na2SO4: non-combustible</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="156.828278" transform="rotate(-0 511.074 156.828278)">✓ removed</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="124.38" y="180.57921" transform="rotate(-0 124.38 180.57921)">Remaining: hydrogen from side reactions or overcharge</text>
   </g>
   <g id="text_20">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="370.458" y="180.841733" transform="rotate(-0 370.458 180.841733)">H2 is flammable (LFL 4 %); needs vent + ventilation (S4)</text>
   </g>
   <g id="text_21">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="180.467624" transform="rotate(-0 511.074 180.467624)">⚠ REMAINS</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="124.38" y="204.218826" transform="rotate(-0 124.38 204.218826)">Remaining: plastic case + binder/carbon in an external fire</text>
   </g>
   <g id="text_23">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="370.458" y="204.218826" transform="rotate(-0 370.458 204.218826)">Case fire load is larger than the stored electrical energy</text>
   </g>
   <g id="text_24">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="204.10724" transform="rotate(-0 511.074 204.10724)">⚠ REMAINS</text>
   </g>
   <g id="text_25">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="124.38" y="227.858442" transform="rotate(-0 124.38 227.858442)">Remaining: electrolyte leakage (conductive, Mn2+ traces)</text>
   </g>
   <g id="text_26">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="370.458" y="227.858442" transform="rotate(-0 370.458 227.858442)">Short-circuit path on busbars/floor; wastewater handling</text>
   </g>
   <g id="text_27">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="227.746856" transform="rotate(-0 511.074 227.746856)">⚠ REMAINS</text>
   </g>
   <g id="text_28">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="124.38" y="251.498058" transform="rotate(-0 124.38 251.498058)">Remaining: Mn2+ dissolution / capacity fade</text>
   </g>
   <g id="text_29">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="370.458" y="251.498058" transform="rotate(-0 370.458 251.498058)">Performance, not fire, hazard; water-quality limits on disposal</text>
   </g>
   <g id="text_30">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="251.386472" transform="rotate(-0 511.074 251.386472)">⚠ REMAINS</text>
   </g>
   <g id="text_31">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="124.38" y="275.137674" transform="rotate(-0 124.38 275.137674)">Remaining: freezing / salt crystallisation</text>
   </g>
   <g id="text_32">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="370.458" y="275.454104" transform="rotate(-0 370.458 275.454104)">0.5 M Na2SO4 saturates near 5 C; water freezes below ~ -2 C</text>
   </g>
   <g id="text_33">
    <text style="font-size: 6.9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="511.074" y="275.026088" transform="rotate(-0 511.074 275.026088)">⚠ REMAINS</text>
   </g>
   <g id="text_34">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="7.2" y="15.558281" transform="rotate(-0 7.2 15.558281)">Safety: the Li-ion runaway chain vs the R1 aqueous cell</text>
   </g>
