   <g id="text_3">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(260.648344 74.554969)">48 V telecom tray</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(251.735328 85.277109)">4 monoblocs + DC/DC</text>
